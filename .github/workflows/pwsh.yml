name: pwsh

on: [push, workflow_dispatch]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: checkout
        uses: actions/checkout@v4
      - name: error
        shell: pwsh
        run: |
          $files = Get-ChildItem -Path ${{ github.workspace }}\.github -Recurse
          $title = "Missing version information"
          Write-Output "::error::❌ This is an error message`n"
          
          $files | Foreach-Object {
            Write-Output "::error title=$title::$_.FullName"
          }