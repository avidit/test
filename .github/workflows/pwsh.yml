name: pwsh

on: [push, workflow_dispatch]

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - name: one
        shell: pwsh
        run: Write-Output ℹ️ step one
      - name: two
        shell: pwsh
        run: Write-Host ⚠️ Warning -ForegroundColor Yellow
      - name: three
        shell: pwsh
        continue-on-error: true
        run: Write-Error ❌ Error
      - name: four
        shell: pwsh
        run: Write-Error ❌ Error -ErrorAction Stop
